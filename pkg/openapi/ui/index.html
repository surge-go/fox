<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenAPI 工作台</title>
    <link rel="stylesheet" href="./app.css?v=20260525-file-tabs" />
    <script id="openapi-ui-config" type="application/json">{"title":"OpenAPI 工作台","specUrl":"openapi.json","storagePrefix":"openapi-ui"}</script>
    <script defer src="./app.js?v=20260525-file-tabs"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-copy">
            <h1 id="doc-title">OpenAPI 工作台</h1>
            <div id="doc-meta" class="muted">等待加载 OpenAPI 配置</div>
          </div>
        </div>

        <div id="summary-strip" class="summary-strip"></div>
        <nav id="operation-list" class="operation-list" aria-label="接口列表"></nav>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div id="workspace-tabs" class="workspace-tabs"></div>
          <div class="topbar-actions">
            <div class="env-trigger">
              <div class="env-select-shell">
                <span id="env-current-badge" class="env-current-badge" aria-hidden="true">环</span>
                <span id="env-current-label" class="env-current-label">环境</span>
                <span class="env-current-caret" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img" focusable="false">
                    <path d="m6 9 6 6 6-6" />
                  </svg>
                </span>
                <select id="server-select" class="control" aria-label="服务地址"></select>
              </div>
              <button id="env-manage" class="button icon secondary" type="button" aria-label="环境管理" title="环境管理">
                <span class="button-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24" role="img" focusable="false">
                    <path d="M4 7h16" />
                    <path d="M4 12h16" />
                    <path d="M4 17h16" />
                  </svg>
                </span>
              </button>
            </div>
            <button id="theme-toggle" class="button icon ghost" type="button" aria-label="切换主题" title="切换主题"></button>
          </div>
        </header>

        <main id="content" class="content" tabindex="-1">
          <section class="empty-state">
            <h2>OpenAPI 接口工作台</h2>
            <p>加载 OpenAPI 文档后，可以浏览接口、查看请求结构、响应示例和数据模型。</p>
          </section>
        </main>
      </section>
    </div>
  </body>
</html>
